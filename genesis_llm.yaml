# Genesis LLM Configuration
# qwen3:4b is the primary local model for GENESIS.
# The runtime should attempt a 131072 context window when launching qwen3:4b.

backend: ollama
default_model: qwen3:4b
num_ctx: 131072

ollama:
  url: http://localhost:11434
  python_api: false  # Use HTTP API directly for reliability

lmstudio:
  url: http://127.0.0.1:11434

hf:
  enabled: false

timeout: 300.0
temperature: 0.3  # Lower temperature for more deterministic JSON output
max_tokens: 4096