document:
  name: Relationship Psychology Content Ontology
  acronym: RPCO
  version: '1.0'
  status: CANONICAL_DRAFT_FOR_CONSTITUTION_INTEGRATION
  purpose: Canonical map Hermes uses to plan, classify, generate, track and learn from the husband-wife relationship and emotional
    psychology channel without inventing random topics.
scope:
  initial_domain: Husband-wife relationship and emotional psychology
  audience: Adults approximately 30–55 in the US, Europe, Australia and New Zealand
  language: English
  creative_mode: Story-first, constructive, non-clinical cinematic entertainment and reflection
  excluded_by_default:
  - abuse-centered plots
  - coercive-control plots
  - suicide or self-harm themes
  - addiction-centered plots
  - criminal psychology
  - explicit sexual material
  - infidelity-driven sensationalism
  - clinical diagnosis
  - pseudo-scientific certainty
  - rage bait
  - manufactured relationship paranoia
  - trauma sensationalism
content_hierarchy:
- 'L1 Niche: Psychology'
- 'L2 Domain: Relationship & Emotional Psychology'
- L3 Problem Family
- L4 Sub-Series / Mechanism Family
- L5 Mechanism Variant
- L6 Story Universe
- L7 Story Arc
- L8 Episode or Multi-Part Episode
- L9 Distribution Assets
separation_of_concerns:
  ontology: Defines WHAT relationship-psychology territory exists; independent of recurring characters.
  psychology_sub_constitution: Defines HOW that territory may be portrayed ethically and narratively.
  story_universe: Defines recurring character canon and continuity. Mark & Sarah is the flagship universe.
  episode_contract: Defines one primary mechanism, causal story and intended resolution.
  commercial_distribution_layer: Defines packaging, platform reuse, retention, monetization and derivatives.
sub_series_admission_rule:
  rule: Create a sub-series only when it differs materially in trigger, primary mechanism, recurring viewer question, relationship
    dynamic, story pattern, or constructive resolution path.
  anti_pattern: Do not manufacture categories merely to make the taxonomy look larger.
episode_laws:
- Exactly one primary psychological mechanism per episode.
- Secondary mechanisms may support but must not compete with the primary mechanism.
- 'Responsibility rotates realistically: Mark, Sarah, both, or circumstances.'
- Never permanently cast one spouse as the flawed partner and the other as the wiser rescuer.
- Problems must remain plausible in ordinary married life and inside the approved safe scope.
- Every episode moves toward constructive understanding, repair, healing, meaningful progress, or a greater-good conclusion.
- Multi-part stories require the complete causal arc and intended final resolution before Part 1 is produced.
- Temporary personal space may be used constructively; permanent Mark/Sarah separation is prohibited.
- No diagnosis, therapy impersonation, medical advice, or scientific/clinical authority.
- Explain what is happening beneath the silence through story first; use concise explicit interpretation only when useful.
flagship_story_universe:
  id: UNIVERSE-MARK-SARAH
  name: Mark & Sarah
  relationship: Married approximately 14 years
  location: Seattle–Bellevue–Redmond, Washington State, USA
  mark:
    age: 40
    profession: Software engineer
  sarah:
    age: 36
    profession: Business operations professional working from home
    family_context: Also carries substantial day-to-day household and family responsibilities
  children:
  - approx_age: 12
  - approx_age: 9
  - approx_age: 6
  children_usage_rule: Children become prominent only when the relationship mechanism genuinely involves parenting/family
    life; otherwise use them as natural background continuity.
  protected_canon:
  - Mark and Sarah remain the same recurring people.
  - Their history accumulates across episodes.
  - Their marriage is constitutionally protected from permanent separation.
  - Breakup/divorce cannot be used as cheap suspense.
  - Temporary emotional distance or healthy personal space may occur when followed by constructive re-engagement.
