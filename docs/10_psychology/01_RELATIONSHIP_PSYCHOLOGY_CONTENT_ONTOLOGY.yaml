cross_cutting_story_dimensions:
  initiating_context:
  - ordinary weekday
  - busy work period
  - remote-work day
  - school-week logistics
  - weekend family time
  - career setback
  - career opportunity
  - unexpected household demand
  - financial planning moment
  - extended-family commitment
  - after a previous unresolved disagreement
  responsibility_pattern:
  - primarily Mark
  - primarily Sarah
  - both contribute differently
  - neither is wrong; needs conflict
  - external circumstance drives pressure
  resolution_pattern:
  - complete resolution
  - meaningful progress
  - new shared agreement
  - apology plus behavioral repair
  - clarified misunderstanding
  - healthy personal space followed by reconnection
  - redistribution of responsibility
  - new communication practice
  - acceptance of an unavoidable tradeoff
  - multi-part continuation toward a predefined final resolution
  emotional_palette:
  - warmth
  - humor
  - teasing
  - affection
  - ordinary domestic happiness
  - awkwardness
  - tenderness
  - frustration
  - sadness
  - uncertainty
  - relief
  - joy
hermes_planning_algorithm:
- Read Psychology Sub-Constitution + RPCO before proposing content.
- Inspect produced/planned inventory; never select topics randomly.
- Prefer an under-covered high-priority Problem Family or Sub-Series unless ORACLE evidence justifies another choice.
- Select exactly one primary mechanism and state its viewer-recognition value.
- Check Mark & Sarah continuity and avoid repeating the same causal situation, conflict choreography, or resolution.
- Choose a believable initiating life context from the established world.
- Rotate responsibility patterns across the catalog.
- Define the complete causal arc and constructive resolution before screenplay generation.
- Choose single-part vs multi-part based on story integrity, never only engagement tactics.
- Create an Episode Contract and send it through GENESIS quality gates.
- Only after narrative approval may PROMETHEUS create production assets.
- Generate the canonical 16:9 master first and derive platform assets from it.
- After publishing, ORACLE updates performance by Problem Family, Sub-Series, mechanism variant, hook, format and resolution.
- Use accumulated evidence to guide coverage without rewriting constitutional boundaries or becoming formulaic.
