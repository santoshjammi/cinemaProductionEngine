- CTR by Problem Family
- retention by Sub-Series
- first-30-second retention by hook type
- completion rate by resolution type
- Short/Reel conversion to long-form
- comments indicating recognition or practical value
- repeat-viewer behavior by story cluster
- series binge behavior
- title/thumbnail promise accuracy
- monetization performance without violating constitutional boundaries
